appId: com.tongshan.culture-platform
productName: 在地文化数字共创平台
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist-release

# 将离线资源打包到安装目录 resources/ 下
extraResources:
  - from: "static"
    to: "static"
    filter:
      - "**/*"
  - from: "resources"
    to: "resources"
    filter:
      - "**/*"

files:
  - "out/**/*"

win:
  target:
    - nsis
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: true
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  runAfterFinish: true
  shortcutName: 在地文化数字共创平台
  deleteAppDataOnUninstall: true
