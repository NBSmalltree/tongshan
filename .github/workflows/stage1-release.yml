name: Stage1 Release

on:
  push:
    tags:
      - 'stage1/v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stage1/package-lock.json

      - name: Extract version from tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/stage1/}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update package.json version
        working-directory: stage1
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ env.VERSION }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        working-directory: stage1
        shell: bash
        run: npm ci

      - name: Build & Package (Windows)
        working-directory: stage1
        shell: bash
        run: npx electron-vite build && npx electron-builder --win --config electron-builder.yml

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage1-windows
          path: stage1/dist-release/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stage1/package-lock.json

      - name: Extract version from tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/stage1/}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update package.json version
        working-directory: stage1
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ env.VERSION }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        working-directory: stage1
        shell: bash
        run: npm ci

      - name: Build & Package (macOS)
        working-directory: stage1
        shell: bash
        run: npx electron-vite build && npx electron-builder --mac --config electron-builder.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stage1-macos
          path: stage1/dist-release/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Extract version from tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/stage1/}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stage1/v${{ env.VERSION }}
          name: "Stage1 大屏机 v${{ env.VERSION }}"
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
