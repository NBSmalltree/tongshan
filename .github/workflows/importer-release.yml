name: Material Importer Release

on:
  push:
    tags:
      - 'importer/v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Extract version from tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/importer/}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update tauri.conf.json version
        working-directory: material-importer/src-tauri
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
            cfg.version = '${{ env.VERSION }}';
            fs.writeFileSync('tauri.conf.json', JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Install frontend dependencies
        working-directory: material-importer
        run: npm install

      - name: Verify and fix icons
        shell: bash
        run: |
          echo "=== Checking icon files ==="
          ls -la material-importer/src-tauri/icons/
          file material-importer/src-tauri/icons/icon.ico || true
          xxd material-importer/src-tauri/icons/icon.ico | head -3 || true
          echo "=== Regenerating with ImageMagick ==="
          dir="material-importer/src-tauri/icons"
          magick -size 32x32 xc:"#3C78D8" "$dir/32x32.png"
          magick -size 128x128 xc:"#3C78D8" "$dir/128x128.png"
          magick -size 256x256 xc:"#3C78D8" "$dir/icon.png"
          magick "$dir/32x32.png" "$dir/128x128.png" "$dir/icon.png" "$dir/icon.ico"
          echo "=== After regeneration ==="
          ls -la "$dir/"
          file "$dir/icon.ico"

      - name: Build Tauri app
        working-directory: material-importer
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: material-importer/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Extract version from tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/importer/}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update tauri.conf.json version
        working-directory: material-importer/src-tauri
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
            cfg.version = '${{ env.VERSION }}';
            fs.writeFileSync('tauri.conf.json', JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Install frontend dependencies
        working-directory: material-importer
        run: npm install

      - name: Build Tauri app
        working-directory: material-importer
        run: npm run tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            material-importer/src-tauri/target/release/bundle/dmg/*.dmg
            material-importer/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Extract version from tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/importer/}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: importer/v${{ env.VERSION }}
          name: "素材导入工具 v${{ env.VERSION }}"
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
